name: Build full local icon catalog

on:
  push:
    branches:
      - codex-full-catalog

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex-full-catalog
          fetch-depth: 0

      - name: Build local catalog
        run: python3 scripts/build_full_catalog.py

      - name: Validate catalog
        run: |
          echo "Codepoint lines: $(wc -l < data/MaterialSymbolsOutlined.codepoints)"
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('material-symbols-data.js','utf8')+'\n'+fs.readFileSync('icons-data.js','utf8')+'\n;this.__names=MATERIAL_SYMBOL_NAMES;this.__load=loadOfficialIcons;this.__icons=()=>ICONS;';
          const ctx={console};
          vm.createContext(ctx);
          vm.runInContext(src,ctx);
          Promise.resolve(ctx.__load()).then(()=>{
            const icons=ctx.__icons();
            const unique=new Set(icons.map(i=>i.name)).size;
            const bad=icons.filter(i=>i.title==='Значок').length;
            console.log('MATERIAL_SYMBOL_NAMES:',ctx.__names.length);
            console.log('ICONS:',icons.length);
            console.log('UNIQUE:',unique);
            console.log('TITLE_Значок:',bad);
            if(ctx.__names.length<=4000||icons.length<=4000||unique<=4000||bad!==0)process.exit(1);
          }).catch(e=>{console.error(e);process.exit(1)});
          NODE
          ! grep -R "fetch('https://fonts.google.com/metadata/icons')" -n icons-data.js app.js

      - name: Commit generated files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material-symbols-data.js icons-data.js app.js index.html material-icons.html
          git commit -m "Use full local Material Symbols catalog"
          git push origin HEAD:codex-full-catalog
