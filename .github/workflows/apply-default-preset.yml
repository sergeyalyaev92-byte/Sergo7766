name: Apply default icon preset

on:
  push:
    paths:
      - '.github/workflows/apply-default-preset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: default-brand-preset
          fetch-depth: 0

      - name: Apply safe patch
        run: python .github/patch_default_preset.py

      - name: Validate defaults and preserved export fix
        shell: bash
        run: |
          set -euo pipefail
          grep -F "iconColor:'#FFFFFF',background:'rounded',backgroundColor:'#AE955F'" app.js
          grep -F "const STORAGE_KEY = 'material-icon-settings-v2';" app.js
          grep -F 'const [minX=0,minY=0,sourceWidth=24,sourceHeight=24]' app.js
          grep -F 'translate(${tx} ${ty}) scale(${sx} ${sy})' app.js
          grep -F 'ru-enhancements.js?v=20260912-3' index.html
          test -f material-symbols-data.js
          test -f ru-enhancements.js
          test -f data/MaterialSymbolsOutlined.codepoints

      - name: Commit clean result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_default_preset.py .github/workflows/apply-default-preset.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Set branded default icon preset'
          git push origin HEAD:default-brand-preset
